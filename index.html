<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="assets/css/01-style.css">
    <link rel="stylesheet" href="assets/css/02-header.css">
</head>

<body>
    <div id="document">
        <section id="header">
            <div id="header_top" class="flex-vertical-centered">
                <h1>Upgrade your Account</h1>
                <div id="progress">
                    <div class="progress_container">
                        <span id="progress_label">1 of 5 Completed</span>
                        <div id="progress_bar" class="flex-vertical-centered">
                            <div id="progress_filler"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="header_bottom">
                <ul id="header_bottom_container">
                    <li class="step">
                        <div class="step_check">
                            <span class="step_nike"></span>
                        </div>
                        <div class="step_label">Aplication data</div>
                    </li>
                    <li class="step">
                        <div class="step_check">
                            <span class="step_nike"></span>
                        </div>
                        <div class="step_label">Tax residency</div>
                    </li>
                    <li class="step">
                        <div class="step_check">
                            <span class="step_nike"></span>
                        </div>
                        <div class="step_label">Identity card</div>
                    </li>
                    <li class="step">
                        <div class="step_check">
                            <span class="step_nike"></span>
                        </div>
                        <div class="step_label">Investability</div>
                    </li>
                    <li class="step">
                        <div class="step_check">
                            <span class="step_nike"></span>
                        </div>
                        <div class="step_label">Review</div>
                    </li>
                </ul>
            </div>
        </section>

        <section id="content">

        </section>

        <section id="footer">

        </section>
    </div>
</body>

</html>
