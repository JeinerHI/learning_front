<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro UI Feedback Form</title>
  <link rel="stylesheet" media="all" href="style.css" />
</head>

<body>
  <div class="feedback-card">
    <div class="feedback-header">
      SEND FEEDBACK
    </div>
    <form class="feedback-body" id="formu">
      <input ,type="text" class="feedback-body__nombre" id="nombre" placeholder="Nombres" />
      <input ,type="text" class="feedback-body__email" id="email" placeholder="Email" />
      <input ,type="dni" class="feedback-body__dni" id="dni" placeholder="DNI" />
      <textarea ,type="text" class="feedback-body__message" placeholder="Message" id="area"></textarea>
      <button class="feedback-body__submit" id="submit"> SEND </button>
    </form>
  </div>

  <script src="regExp.js"></script>
</body>

</html>
