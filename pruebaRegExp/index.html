<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro UI Feedback Form</title>
  <link rel="stylesheet" media="all" href="style.css" />
</head>

<body>
  <div class="feedback-card">
    <div class="feedback-header">
      SEND FEEDBACK
    </div>
    <form class="feedback-body" id="formu">
      <div class="campo">
        <label for="">Ejercicio1</label>
        <input type="text" placeholder="Solo numeros" class="pruebas" id="ejercicio1">
        <div class="err_message"></div>
      </div>
      
      <div class="campo">
        <label for="">Ejercicio2</label>
        <input type="text" placeholder="Codigo postal" class="pruebas" id="ejercicio2">
        <div class="err_message"></div>
      </div>
      <div class="campo">
        <label for="">Ejercicio3</label>
        <input type="text" placeholder="Texto sin espacios" class="pruebas" id="ejercicio3">
        <div class="err_message"></div>
      </div>
      <div class="campo">
        <label for="">Ejercicio4</label>
        <input type="text" placeholder="Email" class="pruebas" id="ejercicio4">
        <div class="err_message"></div>
      </div>
      <div class="campo">
        <label for="">Ejercicio5</label>
        <input type="text" placeholder="Telefono" class="pruebas" id="ejercicio5">
        <div class="err_message"></div>
      </div>
      <div class="campo">
        <label for="">Ejercicio6</label>
        <input type="text" placeholder="Solo espacios" class="pruebas" id="ejercicio6">
        <div class="err_message"></div>
      </div>
      <button class="feedback-body__submit" id="submit"> SEND </button>
    </form>
  </div>

  <script src="regExp.js"></script>
</body>

</html>
