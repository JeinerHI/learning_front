<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retro UI Feedback Form</title>
  <link rel="stylesheet" media="all" href="style.css" />
</head>

<body>
  <div class="feedback-card">
    <div class="feedback-header">
      SEND FEEDBACK
    </div>
    <form class="feedback-body">
      <input ,type="name" class="feedback-body__email" placeholder="Nombre" />
      <br>
      <input ,type="email" class="feedback-body__email" placeholder="Email" />
      <textarea ,type="text" class="feedback-body__message" placeholder="Message"></textarea>
      <button class="feedback-body__submit"> SEND </button>
    </form>
  </div>

  <script src="regExp.js"></script>
</body>

</html>
